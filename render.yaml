services:
  - name: taxerase-web
    type: web
    runtime: ruby
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: ./bin/render-build.sh
    preDeployCommand: bundle exec rails db:migrate
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taxerase-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: taxerase-redis
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true

  - name: taxerase-worker
    type: worker
    runtime: ruby
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: ./bin/render-build.sh
    startCommand: QUEUE=* bundle exec rake resque:work
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taxerase-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: taxerase-redis
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true

  - name: taxerase-scheduler
    type: worker
    runtime: ruby
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: ./bin/render-build.sh
    startCommand: LOAD_RESQUE_SCHEDULE=true bundle exec rake resque:scheduler
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taxerase-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: taxerase-redis
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true

  - name: taxerase-redis
    type: keyvalue
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: taxerase-db
    plan: basic-256mb
