services:
  - name: taxerase-web
    type: web
    runtime: ruby
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: ./bin/render-build.sh
    preDeployCommand: bundle exec rails db:migrate && bundle exec rails db:seed
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taxerase-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true

databases:
  - name: taxerase-db
    plan: basic-256mb
