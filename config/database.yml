default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", ENV.fetch("USER", "postgres")) %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "taxerase_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_TEST_DB", "taxerase_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_PRODUCTION_DB", "taxerase_production") %>
  username: <%= ENV.fetch("POSTGRES_PRODUCTION_USER", ENV.fetch("POSTGRES_USER", "taxerase")) %>
  password: <%= ENV.fetch("POSTGRES_PRODUCTION_PASSWORD", ENV["POSTGRES_PASSWORD"]) %>
